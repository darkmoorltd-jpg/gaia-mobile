name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.enableHermes=true" >> gradle.properties
          if [ -f build.gradle ]; then
            sed -i 's/kotlinVersion = .*/kotlinVersion = "1.9.25"/' build.gradle || true
            sed -i 's/ext.kotlinVersion = .*/ext.kotlinVersion = "1.9.25"/' build.gradle || true
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gaia-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
