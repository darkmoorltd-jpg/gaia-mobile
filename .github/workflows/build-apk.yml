name: Build GAIA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Patch React Native Gradle plugin (serviceOf workaround)
        run: |
          FILE="node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/build.gradle.kts"
          if [ -f "$FILE" ]; then
            echo "Patching: $FILE"
            # Remove the import that no longer exists in modern Gradle
            sed -i '/import org.gradle.configurationcache.extensions.serviceOf/d' "$FILE"
            # Replace serviceOf<ModuleRegistry>() with the modern equivalent
            sed -i 's|serviceOf<ModuleRegistry>()|(project as org.gradle.api.internal.project.ProjectInternal).services.get(ModuleRegistry::class.java)|g' "$FILE"
            echo "----- patched file (first 60 lines) -----"
            head -60 "$FILE"
          else
            echo "File not found: $FILE"
            exit 1
          fi

      - name: Pin Gradle 8.14.3
        run: |
          cd android
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Tune gradle.properties
        run: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g
          android.ndkVersion=27.1.12297006
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
