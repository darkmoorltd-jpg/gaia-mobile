<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA Traceability</title>
    <!-- Use Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border border-gray-700">
        <!-- Loading State -->
        <div id="loading" class="p-10 text-center flex flex-col items-center">
            <svg class="animate-spin h-10 w-10 text-green-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-gray-400">Verifying batch on GAIA Blockchain...</p>
        </div>

        <!-- Result State -->
        <div id="result" class="hidden">
            <div class="bg-gradient-to-r from-green-600 to-green-800 p-6 text-center">
                <div class="text-5xl mb-2">✅</div>
                <h1 class="text-2xl font-bold">Verified Origin</h1>
                <p class="text-green-100 text-sm mt-1">Powered by GAIA & Darkmoor Ltd</p>
            </div>
            
            <div class="p-6 space-y-4">
                <div class="bg-gray-700 rounded-lg p-4 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-400 uppercase tracking-wider">Crop</p>
                        <p id="res-crop" class="font-bold text-lg text-white">-</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-400 uppercase tracking-wider">Weight</p>
                        <p id="res-weight" class="font-bold text-lg text-white">-</p>
                    </div>
                </div>

                <div class="bg-gray-700 rounded-lg p-4">
                    <p class="text-xs text-gray-400 uppercase tracking-wider mb-2">Origin Farm</p>
                    <p id="res-farmer" class="font-bold text-white">-</p>
                    <p id="res-location" class="text-sm text-gray-300">-</p>
                </div>

                <div class="bg-gray-700 rounded-lg p-4">
                    <p class="text-xs text-gray-400 uppercase tracking-wider mb-2">Chain of Custody</p>
                    <div id="res-timeline" class="space-y-2"></div>
                </div>

                <div class="text-center text-xs text-gray-500 mt-6">
                    Batch: <span id="res-code" class="font-mono text-gray-300"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pxvtvuwlpzwlkdoxjrep.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4dnR2dXdscHp3bGtkb3hqcmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTA0NTcsImV4cCI6MjA5OTc4NjQ1N30.gZH1uepXwrCrxC6ElRzkzvGEyGlp-Ep-o4CHXgBMXiY';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
        const urlParams = new URLSearchParams(window.location.search);
        const batchCode = urlParams.get('batch');

        async function loadData() {
            if (!batchCode) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500">No batch code provided.</p>';
                return;
            }

            const { data, error } = await supabase
                .from('batches')
                .select('*, batch_events(*)')
                .eq('batch_code', batchCode)
                .single();

            if (error || !data) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Batch not found or invalid QR.</p>';
                return;
            }

            // Populate data
            document.getElementById('res-crop').innerText = data.crop_name;
            document.getElementById('res-weight').innerText = data.quantity_kg + ' kg';
            document.getElementById('res-location').innerText = data.location || 'Unknown Farm';
            document.getElementById('res-code').innerText = data.batch_code;

            // Fetch farmer name
            const { data: profile } = await supabase.from('user_profiles').select('first_name, last_name').eq('user_id', data.farmer_id).single();
            if (profile) {
                document.getElementById('res-farmer').innerText = profile.first_name + ' ' + profile.last_name;
            }

            // Timeline
            const timeline = document.getElementById('res-timeline');
            data.batch_events.forEach(e => {
                const date = new Date(e.created_at).toLocaleDateString();
                const div = document.createElement('div');
                div.className = 'flex items-start gap-2 text-sm';
                div.innerHTML = `<div class="w-2 h-2 rounded-full bg-green-500 mt-1.5 shrink-0"></div><div><p class="text-white">${e.event_type.toUpperCase()}</p><p class="text-xs text-gray-400">${e.notes || ''}</p><p class="text-xs text-gray-500">${date}</p></div>`;
                timeline.appendChild(div);
            });

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
        }

        loadData();
    </script>
</body>
</html>
